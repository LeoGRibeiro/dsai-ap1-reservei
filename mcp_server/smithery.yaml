# Smithery configuration for Reservei MCP Server
# https://smithery.ai/docs/config

startCommand:
  type: stdio
  config:
    command: "uvx"
    args:
      - "--from"
      - "git+https://github.com/LeoGRibeiro/dsai-ap1-reservei.git#subdirectory=mcp_server"
      - "reservei-mcp"
    env:
      PYTHONIOENCODING: "utf-8"
