[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reservei-mcp"
version = "0.1.0"
description = "Servidor MCP (Model Context Protocol) para agendamento de quadras no complexo esportivo Reservei"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0"
]

[project.scripts]
reservei-mcp = "mcp_server.server:main"
