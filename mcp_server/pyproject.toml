[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "reservei-mcp"
version = "0.1.0"
description = "Servidor MCP (Model Context Protocol) oficial para agendamento de quadras no complexo esportivo Reservei"
readme = "README.md"
authors = [{ name = "Leonardo Ribeiro", email = "leonardogr4324@gmail.com" }]
license = { text = "MIT" }
requires-python = ">=3.10"
keywords = ["mcp", "model-context-protocol", "fastmcp", "reservei", "quadras", "agendamento"]
dependencies = [
    "fastmcp>=2.0.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0"
]

[project.urls]
Homepage = "https://github.com/LeoGRibeiro/dsai-ap1-reservei"
Repository = "https://github.com/LeoGRibeiro/dsai-ap1-reservei"

[project.scripts]
reservei-mcp = "reservei_mcp.server:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["reservei_mcp*"]
